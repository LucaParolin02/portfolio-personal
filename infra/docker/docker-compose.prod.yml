name: portfolio-personal-prod

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: portfolio_reverse_proxy_prod
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - portfolio_network

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: portfolio_frontend_prod
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - portfolio_network

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: portfolio_api_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - portfolio_network

  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_network

volumes:
  portfolio_postgres_data:

networks:
  portfolio_network:
    driver: bridge